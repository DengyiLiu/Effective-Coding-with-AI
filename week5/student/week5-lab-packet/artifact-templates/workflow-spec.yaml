workflow_id: week5_real_project_ai_coding_workflow

states:
  - NEW
  - SCOPED
  - CONTEXT_READY
  - PLAN_READY
  - APPROVED
  - IMPLEMENTING
  - VERIFYING
  - REPAIRING
  - REVIEWING
  - DONE
  - NEEDS_HUMAN

stages:
  reconnaissance:
    actor: ai
    code_edit_allowed: false
    outputs:
      - reconnaissance.md

  planning:
    actor: ai
    code_edit_allowed: false
    outputs:
      - implementation-plan.md
    human_gate: required

  approval:
    actor: human
    code_edit_allowed: false
    outputs:
      - approval.md

  implementation:
    actor: ai_with_human_supervision
    code_edit_allowed: true
    requires:
      - approval.md
    outputs:
      - changed_files
      - diff.patch

  verification:
    actor: script
    code_edit_allowed: false
    command:
      - bash scripts/verify.sh
    outputs:
      - verification-report.md

  repair:
    actor: ai_with_human_supervision
    code_edit_allowed: true
    max_attempts: 2
    must_explain_failure_before_fixing: true
    cannot_modify_tests_to_hide_failure: true
    outputs:
      - repair-notes.md

  review:
    actor: fresh_context_ai_and_human
    code_edit_allowed: false
    outputs:
      - ai-review.md
      - decision-log.md

done_condition:
  - verification passes
  - acceptance criteria have evidence
  - review has no blocking findings
  - human decision is recorded
