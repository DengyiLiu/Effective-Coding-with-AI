task_id: room_booking_waitlist_promotion

problem:
  The booking API rejects overlapping booking requests.
  The product now needs a waitlist and automatic promotion when a confirmed
  booking is cancelled.

user_story:
  As a student, I want to join a waitlist when a room is already booked,
  so that I can get the room automatically if the confirmed booking is cancelled.

acceptance_criteria:
  - AC1: Available room/time requests create confirmed bookings.
  - AC2: Occupied room/time requests create waitlisted bookings.
  - AC3: Waitlisted bookings preserve request order.
  - AC4: Cancelling a confirmed booking with no waitlist simply cancels it.
  - AC5: Cancelling a confirmed booking with a waitlist promotes the earliest waitlisted request for the same room, start_time, and end_time.
  - AC6: Cancelling a waitlisted booking does not promote another booking.
  - AC7: Existing room listing behavior remains unchanged.
  - AC8: Existing confirmed booking behavior remains backward compatible.
  - AC9: Existing cancellation behavior remains backward compatible.
  - AC10: Tests cover the main state transitions.

source_of_truth:
  - docs/api-contract.md
  - docs/architecture.md
  - docs/waitlist-spec.md

non_goals:
  - Do not add authentication.
  - Do not add email notifications.
  - Do not add payment or approval workflow.
  - Do not add recurring bookings.
  - Do not build a frontend.
  - Do not integrate external calendars.
  - Do not redesign unrelated endpoints.
  - Do not add external services.

constraints:
  allowed:
    - add waitlist status
    - add promotion logic
    - add tests
    - update existing conflict-rejection tests to assert waitlist behavior
    - update docs if needed
  needs_approval:
    - changing endpoint names
    - changing response schema
    - adding dependencies
    - modifying verification scripts
  forbidden:
    - deleting existing tests
    - weakening assertions
    - skipping tests
    - rewriting the full app
    - changing unrelated features

verification:
  command:
    - bash scripts/verify.sh
  evidence_required:
    - command output
    - acceptance criteria mapping
    - changed files summary
    - review findings
